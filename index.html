
<div class="field">
  <label for="produce">Crop or produce name</label>
  <input
    id="produce"
    type="text"
    list="cropSuggestions"
    placeholder="e.g. Cassava, Dragon fruit, Sorghum..."
    required
    maxlength="60"
  >
  <datalist id="cropSuggestions">
    <option value="Maize">
    <option value="Tomatoes">
    <option value="Potatoes">
    <option value="Beans">
    <option value="Cassava">
    <option value="Sorghum">
    <option value="Sweet potatoes">
    <option value="Dragon fruit">
    <option value="Avocados">
    <option value="Onions">
  </datalist>
</div>
