
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShambaMarket | Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eff6ef;
      color: #173a27;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 35px #183d2014;
    }
    h1 { color: #176b42; text-align: center; margin-bottom: 8px; }
    p { color: #647469; line-height: 1.5; text-align: center; }
    .tabs { display: flex; gap: 8px; margin: 22px 0; }
    .tabs button { flex: 1; }
    button {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      background: #176b42;
      color: white;
    }
    button.secondary {
      background: white;
      color: #176b42;
      border: 1px solid #cbd9ce;
    }
    button:disabled { opacity: .6; }
    .full { width: 100%; margin-top: 12px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccd8ce;
      border-radius: 8px;
    }
    label { display: block; margin-top: 15px; font-size: 13px; font-weight: bold; }
    .hidden { display: none !important; }
    #status { overflow-wrap: anywhere; font-size: 13px; }
    a { color: #176b42; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌱 ShambaMarket</h1>
    <p>Your marketplace for fresh Kenyan produce.</p>

    <div id="authPanel">
      <div class="tabs">
        <button id="signInTab" type="button">Sign In</button>
        <button id="signUpTab" class="secondary" type="button">Create Account</button>
      </div>

      <form id="emailForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          minlength="6" autocomplete="current-password" required>

        <button id="emailBtn" class="full" type="submit">Sign In</button>
      </form>

      <button id="googleBtn" class="full secondary" type="button">
        Continue with Google
      </button>

      <hr>

      <form id="phoneForm">
        <label for="phone">Phone number with country code</label>
        <input id="phone" type="tel" placeholder="+2547XXXXXXXX"
          autocomplete="tel" required>

        <div id="recaptcha-container" style="margin-top:12px"></div>

        <button id="sendCodeBtn" class="full" type="button">
          Send SMS Code
        </button>

        <label for="smsCode">SMS verification code</label>
        <input id="smsCode" inputmode="numeric" autocomplete="one-time-code"
          placeholder="Enter the code">

        <button id="verifyBtn" class="full" type="button">
          Verify Phone and Sign In
        </button>
      </form>

      <p>By continuing, you agree to use ShambaMarket responsibly.</p>
    </div>

    <div id="welcomePanel" class="hidden">
      <h2>You're signed in! 🎉</h2>
      <p id="userInfo"></p>
      <p id="streakInfo"></p>
      <button id="marketBtn" class="full" type="button">
        Enter Marketplace
      </button>
      <button id="sellBtn" class="full secondary" type="button">
        Sell Produce
      </button>
      <button id="logoutBtn" class="full secondary" type="button">
        Sign Out
      </button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      GoogleAuthProvider,
      signInWithPopup,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPhoneNumber,
      RecaptchaVerifier,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      doc,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const $ = id => document.getElementById(id);

    let mode = "signin";
    let confirmation = null;
    let verifier = null;

    function status(message) {
      $("status").textContent = message;
    }

    function setMode(nextMode) {
      mode = nextMode;
      $("emailBtn").textContent =
        mode === "signup" ? "Create Account" : "Sign In";
      $("password").autocomplete =
        mode === "signup" ? "new-password" : "current-password";
      $("signInTab").classList.toggle("secondary", mode !== "signin");
      $("signUpTab").classList.toggle("secondary", mode !== "signup");
    }

    $("signInTab").onclick = () => setMode("signin");
    $("signUpTab").onclick = () => setMode("signup");

    $("emailForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = $("email").value.trim();
      const password = $("password").value;

      try {
        $("emailBtn").disabled = true;

        if (mode === "signup") {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }

        status("Success! Opening your marketplace...");
      } catch (error) {
        status("Email login error: " + error.message);
      } finally {
        $("emailBtn").disabled = false;
      }
    });

    $("googleBtn").onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (error) {
        status("Google login error: " + error.message);
      }
    };

    $("sendCodeBtn").onclick = async () => {
      const phone = $("phone").value.trim();

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        status("Enter your number with country code, e.g. +2547XXXXXXXX.");
        return;
      }

      try {
        if (!verifier) {
          verifier = new RecaptchaVerifier(
            auth, "recaptcha-container", { size: "normal" }
          );
          await verifier.render();
        }

        confirmation = await signInWithPhoneNumber(auth, phone, verifier);
        status("Code sent. Check your phone.");
      } catch (error) {
        status("Phone verification error: " + error.message);
        if (verifier) {
          try { await verifier.clear(); } catch (_) {}
          verifier = null;
        }
      }
    };

    $("verifyBtn").onclick = async () => {
      if (!confirmation) {
        status("Click Send SMS Code first.");
        return;
      }

      try {
        await confirmation.confirm($("smsCode").value.trim());
      } catch (error) {
        status("Code verification failed: " + error.message);
      }
    };

    function kenyaDate() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Nairobi",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());

      const obj = {};
      parts.forEach(p => obj[p.type] = p.value);
      return `${obj.year}-${obj.month}-${obj.day}`;
    }

    function dayNumber(date) {
      return Math.floor(Date.parse(date + "T00:00:00Z") / 86400000);
    }

    async function recordDailyStreak(user) {
      const today = kenyaDate();
      const ref = doc(db, "users", user.uid);

      return runTransaction(db, async transaction => {
        const snapshot = await transaction.get(ref);
        const data = snapshot.exists() ? snapshot.data() : {};

        let current = Number(data.currentStreak || 0);
        let best = Number(data.bestStreak || 0);
        const last = data.lastCheckIn || "";

        if (last !== today) {
          current = last && dayNumber(today) - dayNumber(last) === 1
            ? current + 1 : 1;
          best = Math.max(current, best);

          transaction.set(ref, {
            displayName: user.displayName || "",
            email: user.email || "",
            currentStreak: current,
            bestStreak: best,
            lastCheckIn: today,
            updatedAt: serverTimestamp()
          }, { merge: true });
        }

        return { current, best };
      });
    }

    onAuthStateChanged(auth, async user => {
      $("authPanel").classList.toggle("hidden", !!user);
      $("welcomePanel").classList.toggle("hidden", !user);

      if (user) {
        $("userInfo").textContent =
          "Signed in as " + (user.displayName || user.email || user.phoneNumber || "member");

        try {
          const streak = await recordDailyStreak(user);
          $("streakInfo").textContent =
            `🔥 Current streak: ${streak.current} day(s) · Best: ${streak.best} day(s)`;
        } catch (error) {
          $("streakInfo").textContent =
            "Your streak could not load. Check your Firestore setup.";
          console.error(error);
        }
      }
    });

    $("marketBtn").onclick = () => location.href = "index.html";
    $("sellBtn").onclick = () => location.href = "sell.html";

    $("logoutBtn").onclick = async () => {
      try {
        await signOut(auth);
        status("Signed out.");
      } catch (error) {
        status(error.message);
      }
    };

    setMode("signin");
  </script>
</body>
</html>
